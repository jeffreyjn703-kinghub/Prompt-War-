<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <linearGradient id="vyntrixa-grad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(10, 5) scale(0.9)">
    <path
      d="M 22 24 L 50 82"
      stroke="url(#vyntrixa-grad)"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M 50 82 L 78 24"
      stroke="url(#vyntrixa-grad)"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="50" cy="82" r="7" fill="#FFFFFF" filter="url(#glow)"/>
    <circle cx="50" cy="82" r="3.5" fill="#4F46E5"/>
    <circle cx="78" cy="24" r="5" fill="#7C3AED"/>
    <circle cx="22" cy="24" r="5" fill="#4F46E5"/>
  </g>

  <!-- Wordmark -->
  <text
    x="115"
    y="56"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-size="38"
    font-weight="800"
    letter-spacing="0.08em"
    fill="url(#text-grad)"
  >VYNTRIXA</text>

  <!-- Tagline -->
  <text
    x="116"
    y="78"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-size="11"
    font-weight="600"
    letter-spacing="0.14em"
    fill="#64748B"
  >ADAPTIVE LEARNING INTELLIGENCE</text>
</svg>
