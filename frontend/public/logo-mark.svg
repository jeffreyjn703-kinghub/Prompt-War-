<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="vyntrixa-grad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Left Ascending Path Arm -->
  <path
    d="M 22 24 L 50 82"
    stroke="url(#vyntrixa-grad)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Right Ascending Path Arm -->
  <path
    d="M 50 82 L 78 24"
    stroke="url(#vyntrixa-grad)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Central Intelligence Node at Vertex -->
  <circle
    cx="50"
    cy="82"
    r="7"
    fill="#FFFFFF"
    filter="url(#glow)"
  />
  <circle
    cx="50"
    cy="82"
    r="3.5"
    fill="#4F46E5"
  />

  <!-- Apex Intelligence Accent Node -->
  <circle
    cx="78"
    cy="24"
    r="5"
    fill="#7C3AED"
  />
  <circle
    cx="22"
    cy="24"
    r="5"
    fill="#4F46E5"
  />
</svg>
