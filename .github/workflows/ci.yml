name: VYNTRIXA CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-quality-and-test:
    name: Backend Test & Security Hardening
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Backend Test Suite
        env:
          SECRET_KEY: "vyntrixa-super-secret-jwt-key-2026-production-hardened-owasp"
        run: |
          pytest backend/tests -v

  frontend-quality-and-test:
    name: Frontend Lint, Test & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Linter (Oxlint 0 Errors / 0 Warnings)
        working-directory: frontend
        run: npm run lint

      - name: Run Frontend Vitest Suite
        working-directory: frontend
        run: npm run test

      - name: Build Production Frontend & PWA Assets
        working-directory: frontend
        run: npm run build
